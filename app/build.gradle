plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phishnet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phishnet.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // QR decoding, fully offline, pure Java (Apache 2.0). Used on the one image the user picks.
    implementation 'com.google.zxing:core:3.5.3'
    // ComponentActivity: the Activity Result API (system photo picker) and Back-press dispatcher.
    implementation 'androidx.activity:activity:1.9.3'

    // CameraX core library using the camera2 implementation
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'
}
